name: Build and publish AniCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream AniCraft release tag (empty means latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild even if the matching MikaPST Release exists"
        required: false
        default: false
        type: boolean

  schedule:
    # Check for new upstream releases every day at 03:47 UTC.
    - cron: "47 3 * * *"

  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"

permissions:
  contents: write
  packages: write

concurrency:
  group: anicraft-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Resolve official AniCraft release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const tag = (process.env.REQUESTED_UPSTREAM_TAG || "").trim();
            const params = { owner: "storytold", repo: "anicraft" };

            const { data: release } = tag
              ? await github.rest.repos.getReleaseByTag({ ...params, tag })
              : await github.rest.repos.getLatestRelease(params);

            if (!release.tag_name) {
              throw new Error("Upstream release has no tag");
            }

            core.info(`Selected upstream release: ${release.tag_name}`);

            core.setOutput("tag", release.tag_name);
            core.setOutput("name", release.name || `AniCraft ${release.tag_name}`);
            core.setOutput("url", release.html_url);
            core.setOutput("prerelease", String(release.prerelease));
            core.setOutput("published_at", release.published_at || "");

      - name: Check existing MikaPST release
        id: release-check
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            let existing = false;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.UPSTREAM_TAG
              });
              existing = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const force =
              process.env.FORCE_REBUILD === "true" ||
              process.env.EVENT_NAME === "push";

            const skip = existing && !force;

            core.info(
              skip
                ? "Already packaged; skipping build."
                : "Building new or requested release."
            );

            core.setOutput("skip", String(skip));

      - name: Checkout official AniCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/anicraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: anicraft-src

      - name: Set up Rust
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI matching upstream Cargo.lock
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        working-directory: anicraft-src
        run: |
          set -euo pipefail

          WANT="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"

          test -n "$WANT"

          cargo install wasm-bindgen-cli --version "$WANT" --locked

      - name: Build official AniCraft WebAssembly application
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        working-directory: anicraft-src
        run: |
          set -euo pipefail

          # Build the official AniCraft WebAssembly application.
          bash scripts/build-web.sh

          # Validate the essential files generated by upstream.
          for file in index.html anicraft.js anicraft_bg.wasm anicraft.png; do
            test -s "web/$file" || {
              echo "::error::Missing or empty web/$file"
              exit 1
            }
          done

          # The HTML user guide is optional in older upstream releases.
          if [ -s "web/guide/index.html" ]; then
            echo "HTML user guide included."
          else
            echo "::notice::HTML user guide not included in this upstream release."
          fi

          echo "AniCraft WebAssembly build validated successfully."

      - name: Prepare Docker build context and preserve upstream notices
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p web/licenses

          # Copy the compiled WebAssembly application.
          cp -a anicraft-src/web/. web/

          # Preserve upstream licensing and attribution files.
          for file in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do
            if [ -f "anicraft-src/$file" ]; then
              cp "anicraft-src/$file" web/licenses/
            fi
          done

          # Preserve third-party license notices when available.
          if [ -d anicraft-src/licenses ]; then
            cp -a anicraft-src/licenses web/licenses/third-party
          fi

          echo "Docker build context prepared successfully."

      - name: Extract upstream commit
        if: steps.release-check.outputs.skip != 'true'
        id: upstream
        shell: bash
        run: |
          echo "sha=$(git -C anicraft-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set lowercase image name
        if: steps.release-check.outputs.skip != 'true'
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anicraft-web" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.upstream-release.outputs.tag }}
            ${{ steps.image.outputs.name }}:upstream-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.title=AniCraft Web
            org.opencontainers.image.description=Community-maintained WebAssembly build of AniCraft
            org.opencontainers.image.source=https://github.com/storytold/anicraft
            org.opencontainers.image.version=${{ steps.upstream-release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update MikaPST GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.upstream-release.outputs.name }}
          UPSTREAM_URL: ${{ steps.upstream-release.outputs.url }}
          UPSTREAM_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          UPSTREAM_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.UPSTREAM_TAG;

            const { data: upstream } =
              await github.rest.repos.getReleaseByTag({
                owner: "storytold",
                repo: "anicraft",
                tag
              });

            const image = process.env.IMAGE_NAME;

            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a self-hosted Docker image.`,
              "",
              "## Docker image",
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHA}\``,
              "",
              "Supported platforms: `linux/amd64`, `linux/arm64`.",
              "",
              "## Upstream project",
              `- **Official release:** [${process.env.UPSTREAM_NAME}](${process.env.UPSTREAM_URL})`,
              `- **Upstream tag:** \`${tag}\``,
              `- **Upstream commit:** \`${process.env.UPSTREAM_SHA}\``,
              `- **Published upstream:** ${process.env.UPSTREAM_PUBLISHED_AT || "not specified"}`,
              "",
              "## Upstream release notes",
              upstream.body || "No release notes provided.",
              "",
              "## Image details",
              `- **Image digest:** \`${process.env.IMAGE_DIGEST}\``,
              "- **Packaging:** community-maintained by MikaPST; not an official AniCraft release.",
              "- **Build source:** official AniCraft source at the upstream release tag above."
            ].join("\n");

            let existing;

            try {
              ({ data: existing } =
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag
                }));
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const args = {
              owner,
              repo,
              tag_name: tag,
              name: `AniCraft Web ${tag}`,
              body,
              draft: false,
              prerelease: process.env.UPSTREAM_PRERELEASE === "true"
            };

            if (existing) {
              await github.rest.repos.updateRelease({
                ...args,
                release_id: existing.id
              });

              core.info(`Updated MikaPST release ${tag}.`);
            } else {
              await github.rest.repos.createRelease({
                ...args,
                target_commitish: context.sha
              });

              core.info(`Created MikaPST release ${tag}.`);
            }
